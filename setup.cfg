[metadata]
name = toupy
version = 0.4.0
author = Julio Cesar da Silva
author_email = julio-cesar.da-silva@neel.cnrs.fr
description = Tomographic Utilities for Python
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/jcesardasilva/toupy
project_urls =
    Bug Tracker = https://github.com/jcesardasilva/toupy/issues
license = GPL-3.0-or-later
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)
    Topic :: Scientific/Engineering
    Topic :: Software Development
    Operating System :: Unix

[options]
package_dir =
    = .
packages = find:
python_requires = >=3.8
zip_safe = False
include_package_data = True
scripts =
    bin/file_comp
    bin/missing_recons
    bin/create_toupy_templates
    bin/plot_projections

[options.packages.find]
where = .
exclude =
    test*
    docs*

[options.package_data]
* = *.txt, *.rst, *.md

[options.extras_require]
resource =
    psutil>=5.8.0
notebook =
    ipympl>=0.9.0
    jupyterlab>=3.0
docs =
    sphinx>=5.0
    sphinx-rtd-theme>=1.0
# Optional PyTorch backend for the two-pass multislice and FBaP GPU paths.
# Not required: toupy falls back to the pure NumPy backend without torch.
# Install with:  pip install toupy[torch]
torch =
    torch>=1.10.0
